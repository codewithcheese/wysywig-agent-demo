name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_bench:
        description: 'Run benchmark suite (lite/full/none)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - lite
          - full

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  bench-lite:
    name: Benchmark (Lite)
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event.inputs.run_bench == 'lite' ||
      github.event.inputs.run_bench == 'full' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark (dry-run check)
        run: npm run bench:lite -- --dry-run

      - name: Run benchmark (lite)
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: anthropic
          LLM_MODEL: claude-haiku-4-5-20251001
        run: npm run bench:lite

      - name: Upload lite results
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-lite-${{ github.sha }}
          path: bench/results/
          retention-days: 30

  bench-full:
    name: Benchmark (Full)
    runs-on: ubuntu-latest
    needs: bench-lite
    if: github.event.inputs.run_bench == 'full' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark (full)
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: anthropic
          LLM_MODEL: claude-haiku-4-5-20251001
        run: npm run bench:full

      - name: Upload full results
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-full-${{ github.sha }}
          path: bench/results/
          retention-days: 30
